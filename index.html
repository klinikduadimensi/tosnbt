<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>CBT SNBT DUA DIMENSI</title>
    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="icon" type="image/x-icon" href="https://ucarecdn.com/e9a7657b-e51e-4c43-a0bb-ee085ad4ca22/favicon.ico">
    
    <style>
        :root { 
            --primary: #0e58a6; 
            --primary-dark: #0b4685; 
            --secondary: #64748b; 
            --bg: #f8fafc; 
            --card: #ffffff; 
            --text: #334155; 
            --success: #10b981; 
            --danger: #ef4444;
            --border: #e2e8f0;
            --radius: 12px;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -2px rgba(0, 0, 0, 0.025);
        }

        body { font-family: 'Inter', 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); margin: 0; height: 100vh; display: flex; flex-direction: column; -webkit-user-select: none; user-select: none; }
        
        /* SNBT Reading Text Style */
        .bacaan-panjang p { text-align: justify; text-indent: 30px; margin-bottom: 15px; line-height: 1.7; }

        /* --- Layout Screens --- */
        #loginScreen, #loadingScreen, #resultScreen { position: fixed; inset: 0; z-index: 999; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, var(--bg) 0%, var(--border) 100%); }
        #ujianScreen { display: none; flex-direction: column; height: 100%; }
        
        /* --- Login Box --- */
        .login-box { background: var(--card); width: 90%; max-width: 450px; padding: 2.5rem 2rem; border-radius: 1.5rem; box-shadow: var(--shadow-lg); border: 1px solid var(--border); }
        .login-header { text-align: center; margin-bottom: 2rem; }
        .login-header h2 { margin: 0; color: var(--primary); font-weight: 800; font-size: 1.5rem; }
        
        /* Custom Dropdown (from old script adapted to new UI) */
        .form-group { margin-bottom: 1.2rem; position: relative; }
        .form-group label { display: block; margin-bottom: 0.5rem; font-weight: 600; font-size: 0.9rem; color: var(--secondary); }
        .custom-select-box { padding: 14px 16px; border: 1px solid var(--border); border-radius: 10px; cursor: pointer; background: #f8fafc; display: flex; justify-content: space-between; align-items: center; font-size: 0.95rem; }
        .custom-select-box:after { content: "▼"; font-size: 0.8rem; color: var(--secondary); }
        .dropdown-menu { display: none; position: absolute; top: 100%; left: 0; right: 0; background: white; border: 1px solid var(--border); box-shadow: var(--shadow-lg); border-radius: 10px; z-index: 10; margin-top: 5px; overflow: hidden; }
        .dropdown-search { padding: 10px; background: #f8f9fa; border-bottom: 1px solid var(--border); }
        .dropdown-search input { width: 100%; padding: 8px; border: 1px solid var(--border); border-radius: 6px; outline: none; box-sizing: border-box; }
        .dropdown-list { max-height: 200px; overflow-y: auto; }
        .dropdown-item { padding: 12px 16px; cursor: pointer; border-bottom: 1px solid #eee; font-size: 0.95rem; }
        .dropdown-item:hover { background: #e7f1ff; color: var(--primary); font-weight: 500; }
        .form-control-readonly { width: 100%; padding: 14px 16px; border: 1px solid var(--border); border-radius: 10px; box-sizing: border-box; font-size: 0.95rem; background: #e9ecef; color: #666; cursor: not-allowed; }
        
        .btn-block { width: 100%; padding: 14px; background: var(--primary); color: white; border: none; border-radius: 10px; font-weight: 700; cursor: pointer; font-size: 1rem; transition: all 0.2s ease; margin-top: 10px; }
        .btn-block:hover { background: var(--primary-dark); transform: translateY(-2px); box-shadow: var(--shadow); }

        /* --- Exam Area --- */
        .top-bar { background: var(--card); padding: 12px 25px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; z-index: 100; box-shadow: var(--shadow-sm); }
        .user-info { font-size: 0.95rem; font-weight: 600; color: var(--text); display: flex; gap: 15px; }
        .info-badge { background: #e7f1ff; color: var(--primary); padding: 5px 12px; border-radius: 20px; font-size: 0.85rem; }
        
        .main-area { display: flex; flex: 1; overflow: hidden; gap: 20px; padding: 20px; position: relative; }
        
        /* Panels */
        .soal-panel { flex: 3; background: var(--card); border-radius: var(--radius); padding: 30px; overflow-y: auto; display: flex; flex-direction: column; box-shadow: var(--shadow); border: 1px solid var(--border); }
        .nav-panel { flex: 1; background: var(--card); border-radius: var(--radius); padding: 25px; overflow-y: auto; max-width: 320px; box-shadow: var(--shadow); border: 1px solid var(--border); }
        
        .nomor-soal { display: flex; justify-content: space-between; border-bottom: 2px solid var(--bg); padding-bottom: 15px; margin-bottom: 20px; font-weight: 700; color: var(--primary); }
        .teks-soal { font-size: 1.05rem; line-height: 1.7; margin-bottom: 25px; color: var(--text); }
        
        /* Options */
        .opsi-group { display: flex; flex-direction: column; gap: 12px; }
        .opsi-item { display: flex; align-items: flex-start; padding: 14px 18px; border: 2px solid var(--border); border-radius: 10px; cursor: pointer; transition: all 0.2s ease; background: var(--card); }
        .opsi-item:hover { background: var(--bg); border-color: #cbd5e1; }
        .opsi-item:has(input:checked) { border-color: var(--primary); background: #e7f1ff; }
        .opsi-item input { margin-right: 15px; margin-top: 4px; transform: scale(1.3); accent-color: var(--primary); cursor: pointer;}
        .opsi-content { flex: 1; overflow-x: auto; line-height: 1.5; font-size: 1rem; }
        
        /* Nav Grid */
        .nav-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
        .nav-btn { aspect-ratio: 1; border: 2px solid var(--border); border-radius: 8px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-weight: 600; font-size: 0.95rem; color: var(--secondary); background: var(--card); transition: 0.2s; }
        .nav-btn:hover { border-color: var(--secondary); color: var(--text); }
        .nav-btn.active { border-color: var(--primary); background: #e7f1ff; color: var(--primary); box-shadow: 0 0 0 2px rgba(14, 88, 166, 0.2); }
        .nav-btn.filled { background: var(--primary); color: white; border-color: var(--primary-dark); }
        
        .timer-display { background: #fffbeb; color: #b45309; padding: 15px; text-align: center; border-radius: 10px; font-size: 1.5rem; font-weight: 800; margin-bottom: 20px; border: 1px solid #fde68a; box-shadow: var(--shadow-sm); letter-spacing: 1px; }
        
        /* Footers */
        .footer-controls { margin-top: auto; display: flex; justify-content: space-between; padding-top: 30px; }
        .btn-nav { padding: 12px 24px; border: none; border-radius: 8px; cursor: pointer; color: white; font-weight: 700; font-size: 0.95rem; transition: 0.2s; box-shadow: var(--shadow-sm); }
        .btn-prev { background: var(--secondary); }
        .btn-prev:hover { background: #475569; }
        .btn-next { background: var(--primary); }
        .btn-next:hover { background: var(--primary-dark); }
        .btn-submit { background: var(--success); display: none; }
        
        /* Mobile Responsiveness */
        @media(max-width: 768px) {
            .main-area { flex-direction: column; padding: 12px; gap: 15px; }
            .nav-panel { display: none; }
            .mobile-header-panel { display: flex; flex-direction: column; gap: 10px; background: var(--card); padding: 15px; border-radius: var(--radius); border: 1px solid var(--border); position: sticky; top: 0; z-index: 95; box-shadow: var(--shadow); }
            .mobile-top-row { display: flex; justify-content: space-between; align-items: center; font-weight: 700; }
            .m-timer { color: #b45309; background: #fffbeb; padding: 8px 12px; border-radius: 8px; border: 1px solid #fde68a; }
            .mobile-nav-trigger-btn { background: var(--bg); color: var(--text); border: 2px solid var(--border); width: 100%; padding: 12px; border-radius: 8px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
            .soal-panel { padding: 20px 15px; }
            .user-info { flex-direction: column; gap: 5px; }
        }
        @media(min-width: 769px) { .mobile-header-panel { display: none; } }

        /* Modals */
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px); z-index: 2000; align-items: center; justify-content: center; }
        .modal-content { background: var(--card); width: 90%; max-width: 380px; padding: 25px; border-radius: 1.2rem; max-height: 85vh; overflow-y: auto; position: relative; box-shadow: var(--shadow-lg); }
        .close-modal { position: absolute; top: 15px; right: 20px; font-size: 1.8rem; cursor: pointer; color: var(--secondary); }
    </style>
</head>
<body>

    <!-- Loading Screen -->
    <div id="loadingScreen">
        <div style="text-align: center; color: var(--primary); font-weight: bold; font-size: 1.2rem;">
            <i class="fas fa-spinner fa-spin fa-2x mb-3"></i><br><br>Memuat Sistem...
        </div>
    </div>

    <!-- Login Screen -->
    <div id="loginScreen" style="display: none;">
        <div class="login-box">
            <div class="login-header">
                <h2>CBT SNBT 2026</h2>
                <p style="margin:5px 0 0; color:var(--secondary); font-size: 0.9rem;">Dua Dimensi Yogyakarta</p>
            </div>
            <form id="biodata-form">
                <div class="form-group">
                    <label>Nama Lengkap Peserta</label>
                    <div class="custom-select-box" id="select-box" onclick="toggleDropdown()">Pilih Nama Lengkap Anda</div>
                    <input type="hidden" id="nama"> 
                    
                    <div class="dropdown-menu" id="dropdown-menu">
                        <div class="dropdown-search">
                            <input type="text" id="search-nama" placeholder="Cari nama..." onkeyup="filterNama()">
                        </div>
                        <div class="dropdown-list" id="dropdown-list"></div>
                    </div>
                </div>
                
                <div class="form-group">
                    <label>Asal Sekolah</label>
                    <input type="text" id="sekolah" class="form-control-readonly" readonly required>
                </div>
                <div class="form-group">
                    <label>Kelas</label>
                    <input type="text" id="kelas" class="form-control-readonly" readonly required>
                </div>
                
                <input type="hidden" id="wa">
                
                <button type="submit" class="btn-block">MULAI UJIAN <i class="fas fa-arrow-right"></i></button>
            </form>
        </div>
    </div>

    <!-- Ujian Screen -->
    <div id="ujianScreen">
        <div class="top-bar">
            <div class="user-info">
                <span>👤 <span id="infoNama">Peserta</span></span>
                <span class="info-badge" id="infoSubtes">📚 Memuat Subtes...</span>
            </div>
            <button onclick="confirmFinish()" style="background:var(--danger); color:white; border:none; padding:8px 15px; border-radius:8px; font-weight:bold; cursor:pointer;">Akhiri Ujian</button>
        </div>
        
        <div class="main-area">
            <!-- Mobile Header Panel -->
            <div class="mobile-header-panel">
                <div class="mobile-top-row">
                    <div id="timerMobile" class="m-timer"><i class="fas fa-clock"></i> 60:00</div>
                </div>
                <button class="mobile-nav-trigger-btn" onclick="toggleNavModal()"><i class="fas fa-th"></i> Daftar Soal</button>
            </div>

            <!-- Panel Soal (Kiri) -->
            <div class="soal-panel">
                <div id="soalContainer"></div>
                <div class="footer-controls">
                    <button class="btn-nav btn-prev" onclick="changeQ(-1)" id="btnPrev">Sebelumnya</button>
                    <button class="btn-nav btn-next" onclick="changeQ(1)" id="btnNext">Selanjutnya</button>
                    <button class="btn-nav btn-submit" onclick="confirmFinish()" id="btnFinish">Kirim Jawaban</button>
                </div>
            </div>

            <!-- Panel Navigasi (Kanan - Desktop) -->
            <div class="nav-panel">
                <div class="timer-display" id="timerDesktop">60:00</div>
                <div style="font-size:0.9rem; margin-bottom:15px; font-weight:bold; color:var(--secondary);">Navigasi Soal</div>
                <div class="nav-grid" id="navGridDesktop"></div>
            </div>
        </div>
    </div>

    <!-- Modal Navigasi Mobile -->
    <div class="modal-overlay" id="mobileNavModal">
        <div class="modal-content">
            <span class="close-modal" onclick="toggleNavModal()">×</span>
            <div style="text-align:center; font-weight:bold; margin-bottom:15px; border-bottom:1px solid var(--border); padding-bottom:10px;">Daftar Soal</div>
            <div class="nav-grid" id="navGridMobile"></div>
        </div>
    </div>

    <!-- Result Screen -->
    <div id="resultScreen" style="display: none;">
        <div class="login-box" style="text-align: center;">
            <div style="font-size:4rem; color:var(--success); margin-bottom:10px;"><i class="fas fa-check-circle"></i></div>
            <h2 style="color:var(--text); margin:0;">Ujian Selesai!</h2>
            <p style="color:var(--secondary); margin-top:10px;">Data jawaban Anda telah berhasil direkam oleh sistem.</p>
            <button onclick="location.reload()" class="btn-block" style="margin-top:20px;">Kembali ke Awal</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
        // GANTI DENGAN URL DEPLOY CODE.GS ANDA (Tetap pakai script GET/POST yang lama)
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbz5nk1UvdBotR7WDsmWqHpioKOTxuVPddgneKjGTreUp4lhHLCk46QFu4KMFvCyUsn2/exec'; 
        
        let questions = [];
        let dataPesertaServer = []; 
        let answers = {};
        let biodata = {};
        let currentIndex = 0;
        let timeRem = 3600; 
        let timerInt;
        let isExamActive = false; 

        document.addEventListener("DOMContentLoaded", async () => {
            try {
                const response = await fetch(SCRIPT_URL);
                if (!response.ok) throw new Error('Gagal mengambil data');
                
                const dataServer = await response.json();
                questions = dataServer.soal;
                dataPesertaServer = dataServer.siswa;
                
                let rawNames = dataPesertaServer.map(p => p.nama);
                let uniqueSortedNames = [...new Set(rawNames)].sort();

                const dropdownList = document.getElementById('dropdown-list');
                uniqueSortedNames.forEach(nama => {
                    let div = document.createElement('div');
                    div.className = 'dropdown-item';
                    div.innerText = nama;
                    div.onclick = () => pilihNama(nama);
                    dropdownList.appendChild(div);
                });

                document.getElementById('loadingScreen').style.display = 'none';
                document.getElementById('loginScreen').style.display = 'flex';
                
            } catch (err) {
                alert("Terjadi kesalahan koneksi. Pastikan URL GAS benar.");
            }
        });

        // --- Dropdown Logic ---
        function toggleDropdown() {
            const menu = document.getElementById('dropdown-menu');
            menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
            document.getElementById('search-nama').focus();
        }

        function filterNama() {
            let filter = document.getElementById('search-nama').value.toUpperCase();
            let items = document.querySelectorAll('.dropdown-item');
            items.forEach(item => {
                let txtValue = item.textContent || item.innerText;
                item.style.display = (txtValue.toUpperCase().indexOf(filter) > -1) ? "" : "none";
            });
        }

        function pilihNama(namaPilihan) {
            document.getElementById('select-box').innerText = namaPilihan;
            document.getElementById('nama').value = namaPilihan;
            document.getElementById('dropdown-menu').style.display = 'none';
            
            const dataSiswa = dataPesertaServer.find(p => p.nama === namaPilihan);
            if (dataSiswa) {
                document.getElementById('sekolah').value = dataSiswa.sekolah;
                document.getElementById('kelas').value = dataSiswa.kelas;
                document.getElementById('wa').value = dataSiswa.wa; 
            }
        }

        window.onclick = function(event) {
            if (!event.target.matches('.custom-select-box') && !event.target.closest('.dropdown-menu')) {
                document.getElementById('dropdown-menu').style.display = 'none';
            }
        }

        function toggleNavModal() { 
            const modal = document.getElementById('mobileNavModal'); 
            modal.style.display = (modal.style.display === 'flex') ? 'none' : 'flex'; 
        }

        // --- Mulai Ujian ---
        document.getElementById('biodata-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const inputNama = document.getElementById('nama').value;
            if (!inputNama) {
                Swal.fire('Perhatian', 'Silakan klik dan pilih nama Anda dari daftar terlebih dahulu.', 'warning');
                return;
            }

            biodata = {
                nama: inputNama,
                asalSekolah: document.getElementById('sekolah').value,
                kelas: document.getElementById('kelas').value,
                nomorWA: document.getElementById('wa').value
            };
            
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('infoNama').innerText = biodata.nama;
            
            const memoriTersimpan = localStorage.getItem('jawaban_cbt_snbt');
            if (memoriTersimpan) answers = JSON.parse(memoriTersimpan);
            
            document.getElementById('ujianScreen').style.display = 'flex';
            isExamActive = true; 
            
            buildNavGrid();
            showQuestion(0);
            
            timerInt = setInterval(() => {
                timeRem--;
                let m = Math.floor(timeRem / 60).toString().padStart(2, '0');
                let s = (timeRem % 60).toString().padStart(2, '0');
                document.getElementById('timerDesktop').innerText = `${m}:${s}`;
                document.getElementById('timerMobile').innerHTML = `<i class="fas fa-clock"></i> ${m}:${s}`;
                if(timeRem <= 0) {
                    clearInterval(timerInt);
                    Swal.fire('Waktu Habis!', 'Sistem akan otomatis mengirim jawaban Anda.', 'warning').then(() => submitQuiz(true));
                }
            }, 1000);
        });

        // --- Render Soal (Dengan Logika Tipe Soal UI Baru) ---
        function showQuestion(index) {
            currentIndex = index;
            const q = questions[index];
            const div = document.getElementById('soalContainer');
            
            // Update Header Subtes (Asumsi q.subtes ada, jika pakai Code.gs lama pakai q.category)
            document.getElementById('infoSubtes').innerText = `📚 ${q.subtes || q.category || "Tes Berlangsung"}`;
            
            // Identifikasi Tipe Soal (Asumsi q.tipe. Jika undefined, anggap PG biasa)
            const tipeSoal = q.tipe ? q.tipe.toUpperCase() : 'PG';

            let h = `<div class="nomor-soal"><span>Soal No. ${q.id}</span></div><div class="teks-soal">${q.text}</div>`;

            if (tipeSoal === 'MCMA') {
                // Tipe Kotak Centang
                const curr = answers[q.id] || []; 
                h += `<div class="opsi-group">`;
                for(let [key, val] of Object.entries(q.options)) {
                    if(!val) continue;
                    const chk = curr.includes(key) ? 'checked' : '';
                    h += `<label class="opsi-item"><input type="checkbox" ${chk} onchange="saveMcma('${q.id}','${key}')"> <div style="display:flex; width:100%;"><b style="margin-right:10px; margin-top:2px;">${key}.</b> <div class="opsi-content">${val}</div></div></label>`;
                }
                h += `</div>`;

            } else if (tipeSoal === 'BS' || tipeSoal === 'BENAR SALAH') {
                // Tipe Benar-Salah
                const curr = answers[q.id] || {}; 
                h += `<div class="opsi-group">`;
                for(let [key, val] of Object.entries(q.options)) {
                    if(!val) continue;
                    const valAns = curr[key] || '';
                    const stB = valAns==='Benar'?'background:var(--primary);color:white;border-color:var(--primary-dark)':'background:white;color:var(--text)'; 
                    const stS = valAns==='Salah'?'background:var(--danger);color:white;border-color:darkred':'background:white;color:var(--text)';
                    
                    h += `<div style="display:flex; justify-content:space-between; padding:15px; border:2px solid var(--border); border-radius:10px; align-items:center; background:var(--card);">
                            <div class="opsi-content"><b>${key}.</b> ${val}</div>
                            <div style="min-width: 130px; text-align:right; display:flex; gap:5px; justify-content:flex-end;">
                                <button style="border:1px solid var(--border); border-radius:6px; padding:6px 12px; font-weight:bold; cursor:pointer; ${stB}" onclick="saveBs('${q.id}','${key}','Benar')">B</button> 
                                <button style="border:1px solid var(--border); border-radius:6px; padding:6px 12px; font-weight:bold; cursor:pointer; ${stS}" onclick="saveBs('${q.id}','${key}','Salah')">S</button>
                            </div>
                          </div>`;
                }
                h += `</div>`;

            } else {
                // Tipe Pilihan Ganda Standar (PG)
                h += `<div class="opsi-group">`;
                for(let [key, val] of Object.entries(q.options)) {
                    if(!val) continue; 
                    const isSel = answers[q.id] === key;
                    h += `<label class="opsi-item"><input type="radio" name="opt" value="${key}" ${isSel ? 'checked' : ''} onchange="saveAnswer('${q.id}', '${key}')"> <div style="display:flex; width:100%;"><b style="margin-right:10px; margin-top:2px;">${key}.</b> <div class="opsi-content">${val}</div></div></label>`;
                }
                h += `</div>`;
            }

            div.innerHTML = h;
            
            document.getElementById('btnPrev').disabled = (index === 0);
            document.getElementById('btnNext').style.display = (index === questions.length - 1) ? 'none' : 'block';
            document.getElementById('btnFinish').style.display = (index === questions.length - 1) ? 'block' : 'none';
            
            updateNavActive();
        }

        // --- Logika Penyimpanan Jawaban ---
        function saveAnswer(id, key) {
            answers[id] = key;
            localStorage.setItem('jawaban_cbt_snbt', JSON.stringify(answers)); 
            buildNavGrid();
            showQuestion(currentIndex); 
        }

        function saveMcma(id, key) { 
            let a = answers[id] || []; 
            if(a.includes(key)) a = a.filter(x => x !== key); else a.push(key); 
            answers[id] = a; 
            localStorage.setItem('jawaban_cbt_snbt', JSON.stringify(answers)); 
            buildNavGrid();
        }

        function saveBs(id, key, val) { 
            let o = answers[id] || {}; 
            o[key] = val; 
            answers[id] = o; 
            localStorage.setItem('jawaban_cbt_snbt', JSON.stringify(answers)); 
            buildNavGrid();
            showQuestion(currentIndex); 
        }

        function changeQ(step) {
            let newIndex = currentIndex + step;
            if(newIndex >= 0 && newIndex < questions.length) showQuestion(newIndex);
        }

        // --- Navigasi Grid ---
        function buildNavGrid() {
            const gridD = document.getElementById('navGridDesktop');
            const gridM = document.getElementById('navGridMobile');
            gridD.innerHTML = ''; gridM.innerHTML = '';
            
            questions.forEach((q, i) => {
                // Mengecek apakah soal sudah dijawab
                let isAnswered = false;
                if (answers[q.id]) {
                    if (Array.isArray(answers[q.id])) { isAnswered = answers[q.id].length > 0; } // Untuk MCMA
                    else if (typeof answers[q.id] === 'object') { isAnswered = Object.keys(answers[q.id]).length > 0; } // Untuk BS
                    else { isAnswered = true; } // Untuk PG
                }

                const createBtn = () => {
                    const btn = document.createElement('div');
                    btn.className = 'nav-btn';
                    if (isAnswered) btn.classList.add('filled'); 
                    if (i === currentIndex) btn.classList.add('active');
                    btn.innerText = q.id;
                    return btn;
                };

                const btnD = createBtn();
                btnD.onclick = () => showQuestion(i);
                gridD.appendChild(btnD);

                const btnM = createBtn();
                btnM.onclick = () => { showQuestion(i); toggleNavModal(); };
                gridM.appendChild(btnM);
            });
        }

        function updateNavActive() {
            document.querySelectorAll('.nav-btn').forEach(b => {
                b.classList.remove('active');
                if(b.innerText == questions[currentIndex].id) b.classList.add('active');
            });
        }

        // --- Submit Logic (Dikembalikan ke Skrip Asli TKA SMP) ---
        function confirmFinish() {
            Swal.fire({
                title: 'Kirim Jawaban',
                text: 'Pastikan semua soal telah terjawab. Apakah Anda yakin ingin mengakhiri ujian?',
                icon: 'question',
                showCancelButton: true,
                confirmButtonText: 'Ya, Kirim Sekarang',
                cancelButtonText: 'Batal',
                confirmButtonColor: '#10b981'
            }).then((result) => { 
                if (result.isConfirmed) submitQuiz(); 
            });
        }

        async function submitQuiz(force = false) {
            clearInterval(timerInt);
            document.getElementById('ujianScreen').style.display = 'none';
            document.getElementById('loadingScreen').style.display = 'flex';

            const payload = { token: "CBT_DUA_DIMENSI_2026", biodata, answers };
            
            setTimeout(async () => {
                try {
                    const response = await fetch(SCRIPT_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify(payload)
                    });
                    
                    const result = await response.json();
                    
                    document.getElementById('loadingScreen').style.display = 'none';
                    if (result.status === 'success') {
                        localStorage.removeItem('jawaban_cbt_snbt');
                        isExamActive = false; 
                        document.getElementById('resultScreen').style.display = 'flex';
                    } else {
                        Swal.fire('Gagal!', result.message, 'error');
                        document.getElementById('ujianScreen').style.display = 'flex';
                    }
                } catch (err) {
                    Swal.fire('Koneksi Terputus', 'Silakan klik tombol Kirim Jawaban sekali lagi.', 'error');
                    document.getElementById('loadingScreen').style.display = 'none';
                    document.getElementById('ujianScreen').style.display = 'flex';
                }
            }, 2000);
        }

        window.addEventListener('beforeunload', function (e) {
            if (isExamActive) { e.preventDefault(); e.returnValue = ''; }
        });
    </script>
</body>
</html>
